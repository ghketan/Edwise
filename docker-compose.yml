version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: edwise_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: edwise_user
      POSTGRES_PASSWORD: edwise_password
      POSTGRES_DB: edwise_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edwise_user -d edwise_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: edwise_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg2://edwise_user:edwise_password@db:5432/edwise_db
      SECRET_KEY: ${SECRET_KEY:-edwise_super_secure_production_secret_key_12345}
    ports:
      - "8000:8000"
    command: >
      sh -c "python backend/seed_data.py &&
             uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: edwise_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:

