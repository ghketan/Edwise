[pytest]
testpaths = .
python_files = test_*.py
python_functions = test_*
markers =
    tier1: Tier 1 isolated happy-path feature tests
    tier2: Tier 2 boundary, corner, and RBAC tests
    tier3: Tier 3 cross-feature pairwise combination tests
    tier4: Tier 4 multi-step real-world scenario tests
    api: Live FastAPI HTTP API tests
    browser: End-to-end Microsoft Edge Playwright browser tests
addopts = -ra --strict-markers
